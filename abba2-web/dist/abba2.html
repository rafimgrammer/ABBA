<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ABBA 2.0 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 디자인 토큰 — 색만 여기서 바꾼다. 팀컬러 변경은 --p 계열만 손대면 된다. */
:root{
  --p:#0F766E;--pp:#115E59;--ps:#E6F4F1;
  --bg:#F4F6F8;--sf:#FFFFFF;--sf2:#F5F6F9;--ln:#E6E8EC;
  --t1:#17202A;--t2:#4B5563;--t3:#8A94A0;--t4:#B3BAC3;
  --up:#E5484D;--down:#2F6FED;--ok:#1F9D55;--warn:#D9760C;--bad:#E5484D;
  --a1:#0F766E;--a2:#5EB5A8;--a3:#7C8DB5;--a4:#F0A63A;
}
/* 리셋·프레임·상단 띠·헤더·본문 여백. 화면 골격. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--t1);font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
.frame{max-width:430px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;display:flex;flex-direction:column}
@media(min-width:600px){body{background:#E9ECF0}.frame{box-shadow:0 0 0 1px var(--ln)}}

.strip{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px;background:#17202A;color:#C9D1D9;font-size:12px;height:34px}
.strip b{color:#fff;font-weight:600}
.strip button{background:transparent;border:1px solid #4B5563;color:#fff;border-radius:999px;padding:3px 10px;font-size:12px;white-space:nowrap;flex-shrink:0}

.top{display:flex;align-items:center;gap:4px;height:52px;padding:0 8px;position:sticky;top:34px;background:var(--bg);z-index:20}
.top .ib{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;border-radius:12px;color:var(--t1)}
.top h2{font-size:17px;font-weight:600;flex:1}
.top .prog{font-size:13px;color:var(--t3);font-variant-numeric:tabular-nums;padding-right:8px}
.bar{height:3px;background:var(--ln);margin:0 16px}
.bar i{display:block;height:100%;background:var(--p);transition:width .2s}
/* 재사용 UI — 카드·버튼·CTA·탭바·배지·시트·토스트. */

.main{padding:8px 16px 150px;flex:1}
h1{font-size:22px;font-weight:700;line-height:1.35;letter-spacing:-.2px;margin:8px 0 14px}
.card{background:var(--sf);border-radius:18px;padding:18px 16px;margin-bottom:12px}
.card h3{font-size:15px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.card h3 svg{color:var(--p)}
.sub{color:var(--t2);font-size:13px;line-height:1.55}
.muted{color:var(--t3);font-size:12px;line-height:1.5}
.big{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px;line-height:1.2}
.mid{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--t2);white-space:nowrap}
.pill.ok{background:#E3F5EA;color:#157A43}.pill.warn{background:#FCEFDF;color:#A85A08}.pill.bad{background:#FDE8E9;color:#B4232A}.pill.info{background:var(--ps);color:var(--p)}
.hr{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--ln);font-size:14px}
.row.first{border-top:0;padding-top:0}
.row .k{color:var(--t2)}
.row .v{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:56px;border:0;border-radius:16px;background:var(--p);color:#fff;font-size:16px;font-weight:600}
.btn:active{background:var(--pp)}
.btn:disabled{background:#D5DAE0;color:#fff;cursor:default}
.btn.ghost{background:var(--sf);color:var(--t1);border:1px solid var(--ln)}
.btn.sm{height:38px;font-size:13px;border-radius:11px;width:auto;padding:0 12px;flex-shrink:0}
.btn.sm.ghost{background:var(--sf)}
.cta{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(244,246,248,0),var(--bg) 35%);z-index:25}
.cta.tabbed{bottom:66px}
.cta .sub2{display:block;text-align:center;margin-top:10px;color:var(--t2);font-size:13px;background:transparent;border:0}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:26}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;color:var(--t3);font-size:11px;font-weight:500;text-decoration:none}
.tabbar a.on{color:var(--p);font-weight:600}
.link{background:transparent;border:0;color:var(--p);font-weight:600;font-size:13px;padding:0}
.note{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--sf2);font-size:12px;color:var(--t2);line-height:1.5;margin-top:10px}
.note svg{flex-shrink:0;color:var(--t3);margin-top:1px}
.tagx{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;background:var(--sf2);color:var(--t2);vertical-align:1px;margin-left:4px}
.tagx.need{background:#FCEFDF;color:#A85A08}
.tagx.plan{background:var(--ps);color:var(--p)}


/* sheet & toast */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:430px;background:var(--sf);border-radius:20px 20px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h4{font-size:15px;font-weight:600;margin:4px 0 6px;display:flex;justify-content:space-between;align-items:center}
.sheet a{display:flex;justify-content:space-between;align-items:center;padding:13px 4px;border-top:1px solid var(--ln);text-decoration:none;font-size:15px;font-weight:500}
.sheet a span{font-size:12px;color:var(--t3);font-weight:400}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:#17202A;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:50;white-space:nowrap}
.fade{animation:fade .18s ease-out}
/* 화면별 스타일 — 시작·대화·계획·브리핑·설정. */
/* start */
.hero{padding:34px 4px 18px}
.brand{font-size:13px;font-weight:700;color:var(--p);letter-spacing:.2px;margin-bottom:10px}
.hero h1{font-size:28px;margin:0 0 12px}
.hero p{color:var(--t2);font-size:15px;line-height:1.6}
.steps{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.step{display:flex;gap:12px;align-items:flex-start;background:var(--sf);border-radius:16px;padding:14px}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--ps);color:var(--p);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.step b{display:block;font-size:14px;font-weight:600;margin-bottom:2px}
.step span{font-size:13px;color:var(--t2);line-height:1.5}

/* chat */
.log{display:flex;flex-direction:column;gap:10px;padding-bottom:8px}
.msg{display:flex;gap:8px;max-width:90%}
.msg.ai{align-self:flex-start}
.msg.me{align-self:flex-end;justify-content:flex-end}
.av{width:28px;height:28px;border-radius:50%;background:var(--p);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.bub{padding:11px 14px;border-radius:18px;font-size:15px;line-height:1.5;white-space:pre-line;word-break:keep-all}
.ai .bub{background:var(--sf);border-top-left-radius:6px}
.me .bub{background:var(--p);color:#fff;border-top-right-radius:6px}
.typing{display:inline-flex;gap:4px;padding:15px 16px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--t4);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
.composer{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;background:var(--sf);border-top:1px solid var(--ln);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:25}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{border:1px solid var(--ln);background:var(--sf);border-radius:999px;padding:8px 13px;font-size:14px;color:var(--t1);text-align:left;line-height:1.3}
.chip:active,.chip.sel{background:var(--ps);border-color:var(--p);color:var(--p)}
.chip small{display:block;font-size:11px;color:var(--t3);font-weight:400}
.chip.wide{border-radius:14px;padding:9px 13px}
.irow{display:flex;align-items:center;gap:8px}
.field{flex:1;display:flex;align-items:center;gap:6px;height:48px;border:1.5px solid var(--ln);border-radius:14px;padding:0 12px;background:var(--sf2)}
.field:focus-within{border-color:var(--p);background:var(--sf)}
.field input{flex:1;min-width:0;border:0;background:transparent;font-size:18px;font-weight:600;font-family:inherit;text-align:right;outline:0;font-variant-numeric:tabular-nums;color:var(--t1)}
.field span{color:var(--t3);font-size:14px;flex-shrink:0}
.send{width:48px;height:48px;border-radius:14px;border:0;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.send:disabled{background:#D5DAE0;cursor:default}
.help{font-size:12px;color:var(--t3);margin-top:6px;min-height:16px;display:flex;justify-content:space-between;gap:8px}
.help.err{color:var(--bad)}
.seg{display:flex;background:var(--sf2);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:10px;font-size:13px;font-weight:500;color:var(--t2)}
.seg button.on{background:var(--sf);color:var(--t1);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
.undo{background:transparent;border:0;color:var(--t3);font-size:12px;padding:0;display:inline-flex;align-items:center;gap:2px}

/* plan */
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:10px 0 12px;background:var(--sf2)}
.stack i{display:block;height:100%}
.c1{background:var(--a1)}.c2{background:var(--a2)}.c3{background:var(--a3)}.c4{background:var(--a4)}
.dot{width:12px;height:12px;border-radius:4px;flex-shrink:0}
.arow{display:grid;grid-template-columns:12px 1fr auto;gap:4px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--ln);font-size:14px}
.arow .r1{display:flex;align-items:center;gap:6px;font-weight:600}
.arow .r2{grid-column:2/4;font-size:12px;color:var(--t3);display:flex;justify-content:space-between;gap:4px 10px;flex-wrap:wrap}
.arow .r2 span{white-space:nowrap}
.arow .amt{font-weight:600;font-variant-numeric:tabular-nums}
.progbar{height:8px;border-radius:4px;background:var(--sf2);overflow:hidden;margin:10px 0 6px}
.progbar i{display:block;height:100%;background:var(--p);border-radius:4px}
.alt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border:1px solid var(--ln);border-radius:14px;margin-top:8px}
.alt.rec{border-color:var(--p);background:var(--ps)}
.alt.off{opacity:.55}
.alt b{display:block;font-size:14px;font-weight:600}
.alt span{font-size:12px;color:var(--t2)}
.alt .rectag{font-size:11px;font-weight:700;color:var(--p);margin-right:4px}
details{margin-top:10px}
summary{cursor:pointer;font-size:13px;color:var(--p);font-weight:600;list-style:none;display:flex;align-items:center;gap:4px}
summary::-webkit-details-marker{display:none}
details .body{margin-top:10px;font-size:13px;color:var(--t2);line-height:1.6}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:8px 4px;text-align:right;border-top:1px solid var(--ln);font-variant-numeric:tabular-nums}
th{color:var(--t3);font-weight:500}
td:first-child,th:first-child{text-align:left}
.segp{display:flex;background:var(--sf2);border-radius:14px;padding:4px;margin-bottom:12px}
.segp button{flex:1;border:0;background:transparent;padding:10px 4px;border-radius:11px;font-size:14px;font-weight:500;color:var(--t2)}
.segp button.on{background:var(--sf);color:var(--t1);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
.opts{display:flex;gap:8px;margin-top:10px}
.opt{flex:1;border:1.5px solid var(--ln);border-radius:14px;padding:10px 8px;background:var(--sf);text-align:center}
.opt.sel{border-color:var(--p);background:var(--ps)}
.opt b{display:block;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.opt span{font-size:12px;color:var(--t3)}

/* brief */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:#FCEFDF;color:#A85A08}
.tick{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--ln)}
.tick.first{border-top:0;padding-top:0}
.tick b{display:block;font-size:14px;font-weight:600}
.tick span{font-size:12px;color:var(--t3)}
.chg{font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;text-align:right}
.chg.up{color:var(--up)}.chg.down{color:var(--down)}.chg.flat{color:var(--t2)}
.chg small{display:block;font-size:11px;font-weight:600;color:var(--warn)}
.news{padding:9px 0;border-top:1px solid var(--ln);font-size:13px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;line-height:1.45}
.tag{flex-shrink:0;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px}
.tag.good{background:#FDE8E9;color:#B4232A}.tag.badn{background:#E3ECFD;color:#1F4FB8}.tag.neu{background:var(--sf2);color:var(--t2)}
.aisay{display:flex;gap:8px;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--ps);font-size:13px;line-height:1.5;color:var(--t1)}
.aisay .av{width:22px;height:22px;font-size:9px;margin-top:1px}
.spark{width:100%;height:110px;display:block;margin-top:6px}
.lgd{display:flex;gap:12px;font-size:11px;color:var(--t3);margin-top:4px}
.lgd i{display:inline-block;width:14px;height:0;border-top:2px solid;vertical-align:middle;margin-right:4px}
.todo{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--ln);font-size:14px}
.todo.first{border-top:0;padding-top:0}
.todo .chk{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--t4);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;color:#fff}
.todo .chk.on{background:var(--p);border-color:var(--p)}
.todo span{font-size:12px;color:var(--t3);display:block}

/* settings & data */
.sw{width:44px;height:26px;border-radius:13px;background:#D5DAE0;position:relative;border:0;flex-shrink:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--p)}.sw.on::after{left:21px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--ln)}
.srow.first{border-top:0;padding-top:0}
.srow b{display:block;font-size:14px;font-weight:600}
.srow span{font-size:12px;color:var(--t3);line-height:1.4}
.mini{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mini button{border:1px solid var(--ln);background:var(--sf);border-radius:999px;padding:5px 10px;font-size:12px;color:var(--t2)}
.mini button.on{border-color:var(--p);color:var(--p);background:var(--ps);font-weight:600}
.src{padding:12px 0;border-top:1px solid var(--ln)}
.src.first{border-top:0;padding-top:0}
.src b{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;margin-bottom:4px}
.src p{font-size:12px;color:var(--t2);line-height:1.5}
.src .meta{display:flex;gap:10px;font-size:11px;color:var(--t3);margin-top:4px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="frame" id="app"></div>
<div id="layer"></div>
<script>
/* ===== config.js ===== */
// 서비스 상수와 계산 가정값. 숫자를 바꾸려면 여기만 고친다.
// [가정] 2026-08 기준. 본 구현에서는 금융감독원 공시 API 값으로 대체한다.

const APP = { name: 'ABBA 2.0', version: '1.3', stage: '시안 · 팀 공유판' };

const M = 10000; // 만 원 → 원

// 연 수익률(세전). 적금만 단리, 나머지는 월복리.
const RATES = { 적금: 0.035, 예금: 0.032, 채권: 0.040, 주식: 0.075 };
const TAX = 0.154;                       // 이자·배당소득세
const KEYS = ['적금', '예금', '채권', '주식'];
// 성향별 기본 배분(%) — 적금·예금·채권·주식
const BASE = { 안정형: [50, 30, 15, 5], 중립형: [35, 15, 20, 30], 공격형: [20, 10, 15, 55] };
const LTV = 0.70, LOAN_RATE = 0.040, LOAN_YEARS = 30; // 집 목표 대출 가정

// 입력 한계 — 음수·0·비현실적 값 차단에 쓴다
const LIMITS = {
  months: { min: 1, max: 600 },
  amount: { min: 10 * M },          // 목표 금액
  house:  { min: 1000 * M },        // 집값
  income: { min: 10 * M, max: 100000 * M },
  money:  { min: 0, max: 100000 * M },
  digits: 9,
};

// 화면 목록 시트에 노출할 팀 문서
const DOCS = [
  { title: '우승 전략 · 9일 계획', desc: '결정 6개 · 역할 · 일정 · 제출 체크', url: 'https://claude.ai/code/artifact/f4e1575b-b190-4717-a29b-4b65f5745a1e' },
  { title: '기획서 v3', desc: '공식 7항목 · 노란 표시 기입 필요', url: 'https://claude.ai/code/artifact/6426b5aa-26b0-47b4-a4d0-4d067f4a18a9' },
  { title: '기능명세서 초안', desc: '기능 36개', url: 'https://claude.ai/code/artifact/4ed3c481-63ea-47cc-80d9-18a0d550d402' },
  { title: '데이터 모델 v1.1', desc: '19개 테이블 · RLS · 파이프라인', url: 'https://claude.ai/code/artifact/03a1e7ac-970f-448b-8dc9-2c98fdc03ee6' },
];

/* ===== utils.js ===== */
// 숫자·통화·날짜 포맷과 DOM 헬퍼.

const $ = (s, el = document) => el.querySelector(s);

const fmt = n => Number(n).toLocaleString('ko-KR');

function won(v, dec) {
  v = Math.round(v); const neg = v < 0; v = Math.abs(v); let s;
  if (v >= 1e8) {
    let eok = Math.floor(v / 1e8); let man = Math.round((v % 1e8) / M);
    if (man === 10000) { eok += 1; man = 0; }
    s = man ? `${fmt(eok)}억 ${fmt(man)}만 원` : `${fmt(eok)}억 원`;
  } else if (v >= M) {
    const man = v / M;
    s = (dec && Math.round(man * 10) % 10) ? `${fmt(Math.round(man * 10) / 10)}만 원` : `${fmt(Math.round(man))}만 원`;
  } else s = `${fmt(v)}원`;
  return (neg ? '-' : '') + s;
}

// 계산 엔진 — 결정적. 화면의 모든 금액·기간은 여기서만 만든다(AI 없음).
// 배분 규칙: 1년 이내 주식 0%, 3년 이내 주식 최대 35%(초과분은 채권).

const ENGINE = {
  weights(risk, months) {
    const w = BASE[risk].slice();
    if (months != null && months <= 12) return [60, 35, 5, 0];
    if (months != null && months <= 36 && w[3] > 35) { w[2] += w[3] - 35; w[3] = 35; }
    return w;
  },
  ruleNote(risk, months) {
    if (months != null && months <= 12) return '1년 이내 목표라 주식은 넣지 않고 적금·예금 위주로 갑니다.';
    if (months != null && months <= 36 && BASE[risk][3] > 35) return '3년 이내 목표라 주식은 35%까지만 두고, 초과분은 채권으로 돌립니다.';
    return null;
  },
  project(saving, lump, n, w) {
    saving = Math.max(0, Number(saving) || 0); lump = Math.max(0, Number(lump) || 0); n = Math.max(0, Math.floor(n) || 0); // 음수 방어
    const wf = w.map(x => x / 100);
    const lw = [0, wf[0] + wf[1], wf[2], wf[3]];
    const rows = KEYS.map((key, k) => {
      const d = saving * wf[k], L = lump * lw[k], r = RATES[key];
      let principal, gross;
      if (key === '적금') { principal = d * n + L; gross = d * n + d * (r / 12) * n * (n + 1) / 2 + L; }
      else { const i = r / 12; principal = d * n + L; gross = (d ? d * (Math.pow(1 + i, n) - 1) / i : 0) + L * Math.pow(1 + i, n); }
      const net = principal + (gross - principal) * (1 - TAX);
      return { key, w: w[k], monthly: d, lump: L, principal, gross, net, gain: net - principal };
    });
    const principal = rows.reduce((s, r) => s + r.principal, 0), net = rows.reduce((s, r) => s + r.net, 0);
    return { rows, principal, net, gain: net - principal };
  },
  monthsToGoal(goal, saving, lump, risk) {
    for (let n = 1; n <= 600; n++) if (ENGINE.project(saving, lump, n, ENGINE.weights(risk, n)).net >= goal) return n;
    return null;
  },
  requiredSaving(goal, n, lump, risk) {
    const w = ENGINE.weights(risk, n);
    const lumpNet = ENGINE.project(0, lump, n, w).net, unit = ENGINE.project(1, 0, n, w).net;
    return Math.max(0, (goal - lumpNet) / unit);
  },
  loanPayment(P, rate = LOAN_RATE, years = LOAN_YEARS) { const i = rate / 12, n = years * 12; return P * i / (1 - Math.pow(1 + i, -n)); },
  blend(w) { return w.reduce((s, x, k) => s + x / 100 * RATES[KEYS[k]], 0); },
};

// 숫자 입력의 파싱·검증. 음수와 기호는 이 파일에서 전부 막는다.
//
// 3중 방어
//   1) onNumKey        — 숫자가 아닌 글자키를 아예 못 누르게 한다(마이너스 포함)
//   2) parseNum        — 붙여넣기·드롭·IME로 들어온 값에서 숫자만 남기고, 무엇을 걸렀는지 알려준다
//   3) validate        — 0 이하·범위 밖 값을 거부하고 이유를 화면에 띄운다
// 엔진(engine.js)에도 마지막 방어가 있어, 어떤 경로로도 음수가 계산에 들어가지 않는다.

const MINUS = /[-−–—+]/;              // 하이픈·유니코드 마이너스·전각 부호·플러스
const NOT_DIGIT_OR_COMMA = /[^\d,]/;

// 키보드에서 숫자가 아닌 글자키를 차단. 조합키·이동키·삭제키는 통과.
function onNumKey(e) {
  if (e.key === 'Enter') { e.preventDefault(); submitInput(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key.length !== 1) return;               // Backspace, Arrow, Tab …
  if (/[0-9]/.test(e.key)) return;
  e.preventDefault();
  setHint(MINUS.test(e.key) ? 'negative' : 'char');
  live();
}

// 붙여넣기·드롭은 막지 않고 들여보낸 뒤 parseNum이 정리한다(모바일 IME 호환).
function onNumBeforeInput(e) {
  if (typeof e.data === 'string' && NOT_DIGIT_OR_COMMA.test(e.data)) setHint(MINUS.test(e.data) ? 'negative' : 'char');
}

let hint = null;
function setHint(kind) { hint = kind; }
function takeHint() { const h = hint; hint = null; return h; }

// 입력창의 값에서 숫자만 남기고 콤마를 다시 붙인다. 캐럿 위치는 앞쪽 숫자 개수로 복원.
// 반환: { n, rejected } — rejected는 'negative' | 'char' | null
function parseNum(el) {
  const raw = el.value, pos = el.selectionStart ?? raw.length;
  const digitsBefore = raw.slice(0, pos).replace(/\D/g, '').length;
  const digits = raw.replace(/\D/g, '').replace(/^0+(?=\d)/, '').slice(0, LIMITS.digits);
  const out = digits ? fmt(Number(digits)) : '';
  let rejected = takeHint();
  if (!rejected && NOT_DIGIT_OR_COMMA.test(raw)) rejected = MINUS.test(raw) ? 'negative' : 'char';
  if (out !== raw) {
    el.value = out;
    let c = 0, i = 0;
    while (i < out.length && c < digitsBefore) { if (/\d/.test(out[i])) c++; i++; }
    try { el.setSelectionRange(i, i); } catch (e) { }
  }
  return { n: digits ? Number(digits) : null, rejected };
}

const REJECT_MSG = { negative: '음수는 입력할 수 없어요', char: '숫자만 입력할 수 있어요' };
const ZERO_OK = ['lump', 'expense'];   // 0을 허용하는 질문(모아둔 돈 없음, 지출 0)

function validate(q, n, rejected) {
  const a = S.a;
  if (rejected && n == null) return { ok: false, msg: REJECT_MSG[rejected] };
  if (n == null) return { ok: false, msg: q.unit === '개월' ? '숫자만 입력' : '만 원 단위로 입력' };

  if (q.unit === '개월') {
    if (n < LIMITS.months.min) return { ok: false, msg: `${LIMITS.months.min}개월 이상이어야 해요` };
    if (n > LIMITS.months.max) return { ok: false, msg: `${LIMITS.months.max}개월(50년) 이하로 입력해 주세요` };
    return { ok: true, msg: `${fmt(n)}개월 = ${ymAdd(n - 1)}까지`, warn: REJECT_MSG[rejected] };
  }

  const v = n * M;
  if (v <= 0 && !ZERO_OK.includes(q.id)) return { ok: false, msg: '0보다 큰 금액을 입력해 주세요' };
  if (v > LIMITS.money.max) return { ok: false, msg: `${won(LIMITS.money.max)} 이하로 입력해 주세요` };

  if (q.id === 'amount' && v < q.min * M) return { ok: false, msg: `${won(q.min * M)} 이상 입력해 주세요` };
  if (q.id === 'lump' && a.amount != null) {
    const t = a.goalType === 'house' ? a.amount * (1 - LTV) : a.amount;
    if (v >= t) return { ok: false, msg: `모아둔 돈이 저축 목표(${won(t)})보다 많아요. 이미 달성한 목표예요` };
  }
  if (q.id === 'income') {
    if (v < LIMITS.income.min) return { ok: false, msg: `${won(LIMITS.income.min)} 이상 입력해 주세요` };
    if (v > LIMITS.income.max) return { ok: false, msg: `${won(LIMITS.income.max)} 이하로 입력해 주세요` };
  }
  if (q.id === 'expense') {
    if (S.chat.mode === 'expense') {
      if (v >= a.income) return { ok: false, msg: `지출이 수입(${won(a.income)})보다 크거나 같아요` };
      return { ok: true, msg: `= ${won(v)} · 남는 돈 ${won(a.income - v)}`, warn: REJECT_MSG[rejected] };
    }
    if (v <= 0) return { ok: false, msg: '1만 원 이상 입력해 주세요' };
    if (v > a.income) return { ok: false, msg: `저축액이 수입(${won(a.income)})보다 커요` };
    return { ok: true, msg: `= ${won(v)} · 수입의 ${Math.round(v / a.income * 100)}%`, warn: REJECT_MSG[rejected] };
  }
  if (q.id === 'saving') {
    const max = Math.max(0, a.income - a.expense);
    if (v > max) return { ok: false, msg: `지출을 빼면 ${won(max)}까지 가능해요` };
    if (v <= 0) return { ok: false, msg: '1만 원 이상 입력해 주세요' };
  }
  return { ok: true, msg: `= ${won(v)}`, warn: REJECT_MSG[rejected] };
}

// 목적 설정 대화 — 질문 흐름, 입력 처리, 답변 저장·되돌리기.

function vChat() {
  const p = progress();
  const c = S.chat;
  if (!c.log.length) { const q = qFor(currentQ()); c.log.push({ who: 'ai', kind: 'q', qid: q.id, text: q.text }); }
  const log = c.log.map(m => m.who === 'ai'
    ? `<div class="msg ai"><div class="av">AI</div><div class="bub">${esc(m.text)}</div></div>`
    : `<div class="msg me"><div class="bub">${esc(m.text)}</div></div>`).join('');
  const typing = c.busy ? `<div class="msg ai"><div class="av">AI</div><div class="bub typing"><i></i><i></i><i></i></div></div>` : '';
  return `${topBar('목적 설정', { backTo: 'start', right: `<span class="prog">${p.done}/${p.total}</span>`, bar: Math.round(p.done / p.total * 100) })}
  <div class="main" style="padding-bottom:230px"><div class="log" id="log">${log}${typing}</div></div>
  ${composer()}`;
}

function composer() {
  const c = S.chat;
  if (c.busy) return `<div class="composer" id="composer"><div class="muted" style="text-align:center;padding:8px 0">답변을 정리하고 있어요</div></div>`;
  if (c.done) return `<div class="composer" id="composer"><button class="btn" onclick="go('plan')">추천 계획 보기 ${ico('right', 18)}</button><div style="display:flex;justify-content:center;margin-top:8px"><button class="undo" onclick="undo()">${ico('undo', 14)} 마지막 답변 수정</button></div></div>`;
  const id = currentQ(); if (!id) return '';
  const q = qFor(id);
  const canUndo = c.log.some(m => m.kind === 'a');
  const undoBtn = canUndo ? `<button class="undo" onclick="undo()">${ico('undo', 14)} 이전 답변 수정</button>` : '';
  let chips = q.chips || [], seg = '';
  if (q.type === 'expense') {
    seg = `<div class="seg"><button class="${c.mode === 'expense' ? 'on' : ''}" onclick="setMode('expense')">월 지출로 답하기</button><button class="${c.mode === 'saving' ? 'on' : ''}" onclick="setMode('saving')">저축액으로 답하기</button></div>`;
    chips = expenseChips(c.mode);
  }
  const chipHtml = `<div class="chips">${chips.map(ch => `<button class="chip ${ch.d ? 'wide' : ''} ${ch.v === 'custom' && c.pendingCustom ? 'sel' : ''}" onclick="chip(${typeof ch.v === 'string' ? `'${ch.v}'` : ch.v})">${esc(ch.l)}${ch.d ? `<small>${esc(ch.d)}</small>` : ''}</button>`).join('')}</div>`;
  const input = q.type === 'chips' ? '' : `<div class="irow"><div class="field"><input id="num" inputmode="numeric" autocomplete="off" placeholder="${q.unit === '개월' ? '개월 수' : '금액'}" aria-label="${q.unit === '개월' ? '개월 수' : '금액(만 원)'}" oninput="live()" onkeydown="onNumKey(event)" onbeforeinput="onNumBeforeInput(event)" onfocus="onFocusNum()"><span>${q.unit}</span></div><button class="send" id="send" aria-label="보내기" onclick="submitInput()" disabled>${ico('up', 22)}</button></div><div class="help" id="help"><span id="helpL">${q.unit === '개월' ? '숫자만 입력' : '만 원 단위로 입력'}</span><span>${undoBtn}</span></div>`;
  return `<div class="composer" id="composer">${seg}${chipHtml}${input}${q.type === 'chips' ? `<div class="help"><span></span><span>${undoBtn}</span></div>` : ''}</div>`;
}

function afterChat() { const l = $('#log'); if (l) window.scrollTo(0, document.body.scrollHeight); }

function setMode(m) { S.chat.mode = m; S.chat.pendingCustom = false; render(); }

function onFocusNum() { setTimeout(() => { const el = $('#num'); if (el) el.scrollIntoView({ block: 'nearest' }); }, 60); }

// 입력할 때마다 도움말과 보내기 버튼 상태를 갱신한다(전체 render 대신).
function live() {
  const el = $('#num'); if (!el) return;
  const q = qFor(currentQ()); const { n, rejected } = parseNum(el); const r = validate(q, n, rejected);
  const help = $('#help'), hl = $('#helpL'), send = $('#send');
  if (hl) hl.textContent = r.ok && r.warn ? `${r.warn} · ${r.msg}` : r.msg;
  if (help) help.classList.toggle('err', !r.ok ? (n != null || !!rejected) : !!r.warn);
  if (send) send.disabled = !r.ok;
}

function submitInput() {
  const el = $('#num'); if (!el) return;
  const q = qFor(currentQ()); const { n, rejected } = parseNum(el); const r = validate(q, n, rejected);
  if (!r.ok) { live(); return; }
  answer(q, n);
}

function chip(v) {
  const q = qFor(currentQ()); if (!q) return;
  if (v === 'custom') { S.chat.pendingCustom = true; const el = $('#num'); if (el) { el.focus(); } document.querySelectorAll('.chip').forEach(b => b.classList.toggle('sel', b.textContent.trim() === '직접 입력')); return; }
  answer(q, v);
}

function answer(q, v) {
  const a = S.a, c = S.chat; let label, ackId = q.id, store = v;
  switch (q.id) {
    case 'goalType': a.goalType = v; label = GOAL_LABEL[v]; break;
    case 'amount': a.amount = v * M; store = a.amount; label = won(a.amount); break;
    case 'months': if (v === 'unknown') { a.months = null; a.monthsKnown = false; store = null; label = '아직 모르겠어요'; } else { a.months = v; a.monthsKnown = true; label = `${fmt(v)}개월`; } break;
    case 'lump': a.lump = v * M; store = a.lump; label = v === 0 ? '없어요' : won(a.lump); break;
    case 'income': a.income = v * M; store = a.income; label = won(a.income); break;
    case 'expense': if (c.mode === 'expense') { a.expense = v * M; store = a.expense; label = `지출 ${won(a.expense)}`; } else { a.saving = v * M; store = a.saving; label = `저축 ${won(a.saving)}`; ackId = 'savingDirect'; } break;
    case 'saving': a.saving = v * M; store = a.saving; label = won(a.saving); break;
    case 'risk': a.risk = v === 'unsure' ? '중립형' : v; S.planRisk = a.risk; label = v === 'unsure' ? '잘 모르겠어요' : v; break;
  }
  c.pendingCustom = false;
  c.log.push({ who: 'me', kind: 'a', qid: q.id, text: label });
  c.busy = true; render();
  setTimeout(() => {
    c.log.push({ who: 'ai', kind: 'ack', qid: q.id, text: ackFor(ackId, store) });
    const next = currentQ();
    if (next) { const nq = qFor(next); c.log.push({ who: 'ai', kind: 'q', qid: nq.id, text: nq.text }); }
    else { c.done = true; c.log.push({ who: 'ai', kind: 'done', text: '필요한 정보는 다 모였어요. 추천 계획을 만들었어요.' }); }
    c.busy = false; render();
  }, 380);
}

function undo() {
  const c = S.chat, a = S.a;
  let idx = -1; for (let i = c.log.length - 1; i >= 0; i--) if (c.log[i].kind === 'a') { idx = i; break; }
  if (idx < 0) return;
  const qid = c.log[idx].qid;
  c.log.splice(idx);
  const from = ORDER.indexOf(qid);
  ORDER.slice(from).forEach(id => { if (id === 'months') { a.months = null; a.monthsKnown = null; } else a[id] = null; });
  if (qid === 'expense') a.saving = null;
  c.done = false; c.pendingCustom = false; S.planRisk = null; render();
}

/* ===== screens/plan.js ===== */
// 추천 계획 — 배분·예상 수익·부족분·조정안·대출 카드.

function planCalc(risk) {
  const a = S.a;
  const house = a.goalType === 'house';
  const target = house ? a.amount * 0.3 : a.amount;
  let months = a.months, computed = false, unreachable = false;
  if (months == null) { months = ENGINE.monthsToGoal(target, a.saving, a.lump, risk); computed = true; if (months == null) { unreachable = true; months = 600; } }
  const w = ENGINE.weights(risk, months), p = ENGINE.project(a.saving, a.lump, months, w);
  const short = target - p.net;
  const status = unreachable ? 'unreach' : short <= 0 ? 'ok' : short <= target * 0.1 ? 'near' : 'redesign';
  const r = { house, target, months, computed, unreachable, w, p, short, status, risk };
  if (house) {
    const price = a.amount, loan = Math.max(0, price - p.net), cap = price * LTV, over = Math.max(0, loan - cap);
    const pmt = ENGINE.loanPayment(Math.min(loan, cap)), ratio = a.income ? pmt / a.income : 0;
    r.loan = { price, loan, cap, over, pmt, ratio, level: ratio <= 0.3 ? 'ok' : ratio <= 0.4 ? 'warn' : 'bad' };
  }
  return r;
}

function suggestGoal(n) { const p = ENGINE.project(S.a.saving, S.a.lump, n, ENGINE.weights(S.planRisk || S.a.risk, n)); return Math.floor(p.net / (10 * M)) * 10 * M; }

function pickSuggest(n) { S.a.months = n; S.a.amount = suggestGoal(n); S.a.suggested = true; render(); }

function setRisk(r) { S.planRisk = r; if (S.a.goalType === 'none' && S.a.suggested) S.a.amount = suggestGoal(S.a.months); render(); }

function applyMonths(n) { S.a.months = n; S.a.monthsKnown = true; toast(`기간을 ${n}개월로 바꿨어요`); render(); }

function applySaving(v) { S.a.saving = v; toast(`월 저축액을 ${won(v)}으로 바꿨어요`); render(); }

function applyRisk(r) { S.planRisk = r; toast(`${r}으로 바꿨어요`); render(); }

const STATUS = { ok: ['ok', '계획대로 가능'], near: ['warn', '조금 부족'], redesign: ['bad', '재설계 필요'], unreach: ['bad', '도달 어려움'] };

function vPlan() {
  const a = S.a; const risk = S.planRisk || a.risk;
  let suggestCard = '';
  if (a.goalType === 'none') {
    if (a.amount == null) { if (a.months == null) a.months = 24; a.amount = suggestGoal(a.months); a.suggested = true; }
    const opts = a.monthsKnown ? [a.months] : [12, 24, 36];
    suggestCard = `<div class="card"><h3>${ico('target', 18)}제안한 목표</h3>

const SERIES = (() => {
  const up = [], dn = [];
  for (let i = 0; i < 45; i++) {
    const wob = 0.9 * Math.sin(i * 0.8) + 0.5 * Math.sin(i * 2.3);
    up.push(i < 38 ? 104 - i * 0.2 + wob : 96.4 + (i - 38) * 1.8 + wob);   // 완만한 하락 뒤 최근 7일 반등 → 골든크로스 4일째
    dn.push(i < 38 ? 100 + i * 0.2 + wob : 107.6 - (i - 38) * 1.8 + wob);  // 완만한 상승 뒤 최근 7일 하락 → 데드크로스 4일째
  }
  return { up, dn };
})();

function ma(arr, n) { return arr.map((_, i) => i < n - 1 ? null : arr.slice(i - n + 1, i + 1).reduce((s, x) => s + x, 0) / n); }

function spark(arr) {
  const m5 = ma(arr, 5), m20 = ma(arr, 20); const from = 20; const xs = arr.slice(from), a5 = m5.slice(from), a20 = m20.slice(from);
  const all = xs.concat(a5, a20).filter(x => x != null); const lo = Math.min(...all) - 0.5, hi = Math.max(...all) + 0.5;
  const W = 360, H = 100, X = i => (i / (xs.length - 1)) * (W - 4) + 2, Y = v => H - 4 - (v - lo) / (hi - lo) * (H - 8);
  const line = (d, st) => `<polyline fill="none" points="${d.map((v, i) => v == null ? '' : `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).filter(Boolean).join(' ')}" ${st}/>`;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="최근 25일 가격과 이동평균선">${line(xs, 'stroke="#17202A" stroke-width="1.6"')}${line(a5, 'stroke="#0F766E" stroke-width="2"')}${line(a20, 'stroke="#F0A63A" stroke-width="2" stroke-dasharray="5 3"')}</svg>
  <div class="lgd"><span><i style="border-color:#17202A"></i>종가</span><span><i style="border-color:#0F766E"></i>5일선</span><span><i style="border-color:#F0A63A;border-top-style:dashed"></i>20일선</span></div>`;
}

function maState(arr) { const m5 = ma(arr, 5), m20 = ma(arr, 20); const l = arr.length - 1; const above = m5[l] > m20[l]; let days = 0; for (let i = l; i >= 19; i--) { if ((m5[i] > m20[i]) === above) days++; else break; } return { above, days }; }

function toggleAlert(k) { S.brief.alerts[k] = !S.brief.alerts[k]; render(); }

function setTime(t) { S.brief.time = t; render(); }

function setTh(t) { S.brief.th = t; render(); }

/* ===== router.js ===== */
// 해시 라우터 — 화면 전환과 렌더링 진입점.

function route() { const h = location.hash.replace(/^#\/?/, ''); return h || 'start'; }

function go(r) { location.hash = r === 'start' ? '#/' : '#/' + r; }

function planReady() { return S.a.risk != null; }

function render() {
  let r = route();
  if (r === 'plan' && !planReady()) { go('chat'); return; }
  const app = $('#app');
  const view = { start: vStart, chat: vChat, plan: vPlan, brief: vBrief, data: vData, settings: vSettings }[r] || vStart;
  app.innerHTML = strip() + view();
  window.scrollTo(0, 0);
  if (r === 'chat') afterChat();
}

/* ===== main.js ===== */
// 부팅 — 화면은 문자열 템플릿으로 그리고 인라인 onclick으로 함수를 부른다.
// 모듈 스코프는 전역이 아니므로, 템플릿에서 부르는 함수만 여기서 window에 노출한다.
// (본 구현에서 React로 옮길 때 이 파일이 사라지고 각 화면이 컴포넌트가 된다.)

Object.assign(window, {
  go, startChat, fillExample, openSheet, closeSheet,
  onNumKey, onNumBeforeInput, onFocusNum, live, submitInput, chip, undo, setMode,
  pickSuggest, setRisk, applyMonths, applySaving, applyRisk,
  toggleAlert, setTime, setTh,
});

window.addEventListener('hashchange', render);
render();
</script>
