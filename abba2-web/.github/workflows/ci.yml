name: abba2-web CI
# React 앱을 빌드하고, 빌드 결과가 최신인지 확인한 뒤 UI 테스트를 돌린다.
on:
  push: { branches: ['**'] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      - run: pip install playwright && playwright install --with-deps chromium
      - name: 빌드
        run: npm run build
      - name: 빌드 결과가 최신인지 확인
        run: git diff --exit-code dist/ || (echo "dist/가 src/와 다릅니다. npm run build 후 커밋하세요." && exit 1)
      - name: UI 테스트 (단일 파일)
        run: python3 tests/test_ui.py dist
