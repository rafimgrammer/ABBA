name: abba2-web CI
# 키 없이 빌드가 되는지 확인하고(dist는 커밋하지 않는다) UI 테스트를 돌린다.
on:
  push: { branches: ['**'] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      - run: pip install playwright && playwright install --with-deps chromium
      - name: 빌드
        run: npm run build
      - name: 소스에 API 키가 섞이지 않았는지
        run: |
          if grep -rn "AQ\.[A-Za-z0-9_-]\{30,\}" src/ tests/ *.js *.json *.html 2>/dev/null; then
            echo "소스에 API 키로 보이는 문자열이 있습니다. .env.local로 옮기세요." && exit 1
          fi
      - name: UI 테스트 (단일 파일)
        run: python3 tests/test_ui.py dist
