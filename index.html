<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F3F8">
<title>에이빠 베타</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F3F3F8; --surface:#FFFFFF; --surface-2:#F6F6FA; --surface-3:#ECECF3;
  --text:#191F28; --text-2:#4E5968; --text-3:#8B95A1; --text-4:#B0B8C1;
  --line:#E4E5EE;
  --accent:#4338CA; --accent-press:#3730A3; --accent-soft:#ECEBFF; --accent-text:#4338CA;
  --lime:#C6F432; --lime-text:#191F28;
  --good:#12A66B; --good-soft:#E6F7EF; --warn:#D9760C; --warn-soft:#FFF1E0; --bad:#E5484D; --bad-soft:#FDECEC;
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;color:var(--text);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;word-break:keep-all;letter-spacing:-0.01em}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font-family:inherit;font-size:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

.app{max-width:430px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative}
@media (min-width:700px){.app{min-height:calc(100dvh - 48px);margin:24px auto;border-radius:32px;overflow:hidden;box-shadow:0 20px 60px rgba(25,31,40,.16)}}

.top{position:sticky;top:0;z-index:5;background:var(--bg)}
.top .row{display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 8px}
.top .back{width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;border-radius:12px;color:var(--text)}
.top .back:active{background:var(--surface-3)}
.top .home{border:0;background:transparent;color:var(--text-3);font-size:13px;font-weight:500;padding:8px 12px;border-radius:10px}
.top .home:active{background:var(--surface-3)}
.progress{height:3px;background:var(--line);margin:0 20px;border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s ease}

main{padding:20px 20px 150px}
main.enter{animation:enter .18s ease-out both}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-size:24px;line-height:1.35;font-weight:700;margin:6px 0 6px;letter-spacing:-0.02em;text-wrap:balance}
.sub{color:var(--text-2);font-size:15px;margin:0 0 20px}
.label{font-size:13px;font-weight:600;color:var(--text-3);margin:22px 0 10px}
.label:first-child{margin-top:0}
.note{font-size:12.5px;color:var(--text-3);line-height:1.5;margin-top:14px}
.link{border:0;background:transparent;color:var(--accent-text);font-weight:600;font-size:14px;padding:6px 0}

.card{background:var(--surface);border-radius:var(--radius);padding:18px 20px;margin-bottom:12px}
.card .k{font-size:13px;color:var(--text-3);font-weight:500}
.card .big{font-size:32px;font-weight:700;letter-spacing:-0.03em;line-height:1.2;margin-top:4px}
.card .big small{font-size:15px;font-weight:500;color:var(--text-3);margin-left:4px;letter-spacing:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:var(--surface-2);border-radius:14px;padding:12px 14px}
.stat .k{font-size:12px;color:var(--text-3)}
.stat .v{font-size:17px;font-weight:700;margin-top:2px}
.stat .v.bad{color:var(--bad)} .stat .v.good{color:var(--good)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:14.5px}
.row:first-of-type{border-top:0}
.row .l{color:var(--text-2)} .row .r{font-weight:600}
.row .r small{font-weight:500;color:var(--text-3);font-size:12px;margin-left:4px}

.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px;background:var(--surface-3);color:var(--text-2)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.accent{background:var(--accent-soft);color:var(--accent-text)} .pill.lime{background:var(--lime);color:var(--lime-text)}

.choice{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid transparent;border-radius:var(--radius);padding:16px 18px;margin-bottom:10px;transition:border-color .12s,background .12s}
.choice .t{font-weight:600;font-size:16px}
.choice .s{font-size:13px;color:var(--text-3);margin-top:2px}
.choice .r{font-weight:700;font-size:15px;white-space:nowrap;color:var(--text-2)}
.choice .chk{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.choice.on{border-color:var(--accent);background:var(--accent-soft)}
.choice.on .chk{background:var(--accent);border-color:var(--accent)}
.choice:active{transform:scale(.99)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1.5px solid transparent;border-radius:var(--radius);padding:16px;text-align:left;min-height:76px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.tile .t{font-weight:600} .tile .s{font-size:12.5px;color:var(--text-3)}
.tile.on{border-color:var(--accent);background:var(--accent-soft)}
.choice:focus-visible,.tile:focus-visible,.btn:focus-visible,.chip:focus-visible,.seg button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.amount{display:flex;align-items:baseline;justify-content:flex-end;gap:6px;background:var(--surface);border-radius:var(--radius);padding:14px 18px}
.amount input{flex:1;border:0;background:transparent;min-width:0;text-align:right;font-size:28px;font-weight:700;letter-spacing:-0.02em;padding:2px 0;outline:none}
.amount input::placeholder{color:var(--text-4);font-weight:600}
.amount .unit{font-size:16px;font-weight:600;color:var(--text-3)}
.amount.sm input{font-size:22px}
.amount.xs input{font-size:18px}
.field{margin-bottom:12px}
.field .label{margin:0 0 8px}
.hint{font-size:12.5px;color:var(--text-3);margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:0;background:var(--surface);border-radius:99px;padding:9px 14px;font-size:14px;font-weight:500;color:var(--text-2)}
.chip.on{background:var(--text);color:#fff}
.seg{display:flex;background:var(--surface-3);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:9px 6px;font-weight:600;font-size:13.5px;color:var(--text-3);line-height:1.25}
.seg button small{display:block;font-size:11px;font-weight:500;color:var(--text-3)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(25,31,40,.08)}
.seg button.on small{color:var(--accent-text)}

.voice{margin:0 0 18px}
.voice .who{font-size:12px;font-weight:600;color:var(--text-3);margin:0 0 6px 4px}
.voice .bubble{background:var(--surface);border-radius:6px 20px 20px 20px;padding:14px 16px;font-size:15.5px;line-height:1.6;color:var(--text)}
.voice .bubble b{font-weight:700}
.me{display:flex;justify-content:flex-end;margin:0 0 12px}
.me span{background:var(--accent);color:#fff;border-radius:20px 6px 20px 20px;padding:10px 14px;font-size:14.5px;font-weight:500}

.cta{position:fixed;left:0;right:0;bottom:0;z-index:6;pointer-events:none}
.cta .inner{max-width:430px;margin:0 auto;padding:16px 20px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(243,243,248,0),var(--bg) 45%);pointer-events:auto}
.btn{width:100%;border:0;border-radius:16px;padding:0 16px;height:56px;font-size:17px;font-weight:700;background:var(--accent);color:#fff;transition:background .12s,transform .06s}
.btn:active{background:var(--accent-press);transform:scale(.99)}
.btn:disabled{background:#E5E8EB;color:#B0B8C1}
.btn.ghost{background:transparent;color:var(--text-2);height:48px;font-size:15px;margin-top:4px}
.btn.sm{width:auto;height:44px;font-size:14px;border-radius:12px;padding:0 16px;background:var(--text)}
.btn.soft{background:var(--accent-soft);color:var(--accent-text)}

.bar{height:6px;background:var(--surface-3);border-radius:99px;overflow:hidden;margin:14px 0 6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar i.over{background:var(--bad)}
svg.chart{width:100%;height:150px;display:block;margin:8px 0 0}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--text-3);margin-top:4px}
.legend i{display:inline-block;width:14px;height:0;border-top:3px solid var(--accent);vertical-align:middle;margin-right:5px;border-radius:2px}
.legend i.p{border-top:2px dashed var(--text-4)}
.legend i.g{border-top:2px dashed var(--lime);filter:saturate(1.2)}

.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid transparent;border-radius:var(--radius);padding:16px 18px;margin-bottom:10px}
.opt > span:first-child{display:flex;flex-direction:column;min-width:0}
.opt .t{font-weight:600;font-size:15.5px}
.opt .d{display:block;font-size:13px;color:var(--text-3);margin-top:3px}
.opt .v{font-size:19px;font-weight:700;white-space:nowrap;letter-spacing:-0.02em}
.opt .v small{display:block;font-size:12px;font-weight:500;color:var(--text-3);text-align:right}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{opacity:.55}
.opt .tags{display:flex;gap:6px;margin-top:6px}

.quick{display:flex;gap:8px;overflow-x:auto;margin:0 -20px 16px;padding:0 20px 4px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:9px 14px;font-size:13.5px;font-weight:500;color:var(--text-2)}

.month{display:grid;grid-template-columns:58px 1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.month:first-of-type{border-top:0}
.month .m{color:var(--text-3);font-size:12.5px}
.month .tot{text-align:right;font-weight:600}
.month .tot small{display:block;font-weight:500;font-size:11.5px;color:var(--good)}
.month.goal .tot{color:var(--accent-text)}
.mhead{display:grid;grid-template-columns:58px 1fr auto;gap:8px;font-size:11.5px;color:var(--text-3);padding:4px 0 6px}
.mhead span:last-child{text-align:right}

.cmp{display:grid;grid-template-columns:1fr;gap:0}
.cmp .r{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.cmp .r:first-child{border-top:0}
.cmp .r b{font-weight:600}
.cmp .r small{color:var(--text-3);font-size:12px;display:block}
.cmp .r .rate{color:var(--text-3);font-size:12.5px}
.cmp .r.on b{color:var(--accent-text)}

details.basis{margin-top:6px;background:var(--surface);border-radius:var(--radius);padding:14px 18px;font-size:13px;color:var(--text-2)}
details.basis summary{cursor:pointer;font-weight:600;color:var(--text);list-style:none;display:flex;justify-content:space-between;align-items:center}
details.basis summary::-webkit-details-marker{display:none}
details.basis summary::after{content:"열기";font-size:12px;color:var(--text-3);font-weight:500}
details.basis[open] summary::after{content:"닫기"}
details.basis code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:5px}
details.basis p{margin:8px 0 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="cta" id="cta"></div>

<script>
/* ---------- 운용 방식 (기본 수익률 가정, 2026-08-27 기준) ---------- */
const SCEN = {
  safe:     {key:'safe',     label:'안전형', rate:0.035, kind:'simple',   tax:0.154, type:'정기적금·예금 유형',
             why:'원금이 보장되고 금리가 확정돼요. 목표 기간이 3년 이내라면 이 유형이 기본이에요.',
             src:'한국은행 기준금리 연 3.00% (2026-08-27 인상), 시중은행 12개월 정기예금 약 4.0% 수준. 적금은 우대 조건에 따라 달라 보수적으로 3.5% 가정'},
  balanced: {key:'balanced', label:'균형형', rate:0.055, kind:'compound', tax:0.154, type:'적금 + 지수 ETF 적립식 유형',
             why:'절반은 적금으로 지키고 절반은 지수 ETF에 적립해요. 원금 일부는 흔들릴 수 있어요.',
             src:'안전형(3.5%)과 성장형(7.5%)의 중간 가정'},
  growth:   {key:'growth',   label:'성장형', rate:0.075, kind:'compound', tax:0.154, type:'지수 ETF·주식 적립식 유형',
             why:'수익률 기대가 가장 크지만 원금 손실 가능성이 있어요. 3년 미만 목표에는 권하지 않아요.',
             src:'코스피 배당 포함 20년(2005~2024) 연평균 약 7.5% (SlickCharts·NYU Stern 자료 인용). S&P500은 같은 기간 약 10.4%. 과거 수익률이며 보장되지 않음'},
  custom:   {key:'custom',   label:'직접 입력', rate:0.04, kind:'compound', tax:0.154, type:'직접 정한 수익률',
             why:'직접 정한 연 수익률로 계산해요.', src:'사용자 입력'}
};

/* ---------- 계산 엔진 (결정적) ---------- */
const ENGINE = {
  sc(){ return S.scen==='custom' ? Object.assign({}, SCEN.custom, {rate:S.customRate}) : SCEN[S.scen]; },
  // 적립 만기액: 월납 d, n개월, 세후
  fv(d, n, sc){ sc=sc||this.sc(); if(n<=0) return 0; const i=sc.rate/12;
    if(sc.kind==='simple'){ return d*n + d*i*n*(n+1)/2*(1-sc.tax); }
    const gross = d*((Math.pow(1+i,n)-1)/i); return d*n + (gross - d*n)*(1-sc.tax); },
  // 이미 모아둔 돈 L을 같은 방식으로 굴렸을 때
  lumpFV(L, n, sc){ sc=sc||this.sc(); if(!L) return 0; const i=sc.rate/12;
    if(sc.kind==='simple'){ return L*(1 + sc.rate*n/12*(1-sc.tax)); }
    return L + (L*Math.pow(1+i,n) - L)*(1-sc.tax); },
  total(d, n, L, sc){ return this.fv(d,n,sc) + this.lumpFV(L,n,sc); },
  annuity(n, sc){ sc=sc||this.sc(); const i=sc.rate/12;
    if(sc.kind==='simple') return n + i*n*(n+1)/2*(1-sc.tax);
    return n + (((Math.pow(1+i,n)-1)/i) - n)*(1-sc.tax); },
  required(goal, n, L, sc){ sc=sc||this.sc(); const rest = goal - this.lumpFV(L||0,n,sc); return Math.max(0, rest/this.annuity(n,sc)); },
  months(goal, d, L, sc){ sc=sc||this.sc(); L=L||0; if(this.lumpFV(L,0,sc)>=goal) return 0; if(d<=0){ for(let n=1;n<=600;n++){ if(this.lumpFV(L,n,sc)>=goal) return n; } return Infinity; }
    for(let n=1;n<=600;n++){ if(this.total(d,n,L,sc)>=goal) return n; } return Infinity; },
  breakdown(d, n, L, sc){ const principal=d*n+(L||0); const total=this.total(d,n,L||0,sc); return {principal, total, gains: total-principal}; },
  options({goal, months, capacity, discretionary, lump}){
    const req = this.required(goal, months, lump);
    const gap = req - capacity;
    const period = this.months(goal, capacity, lump);
    const amount = this.total(capacity, months, lump);
    let spend=null, mix=null;
    if(discretionary!=null && discretionary>=0){
      const feasible = gap <= discretionary*0.4;
      spend = {cut: gap, feasible};
      const mixCut = Math.min(gap, Math.floor(discretionary*0.4/50000)*50000);
      if(mixCut>0 && mixCut<gap){ mix = {cut: mixCut, months: this.months(goal, capacity+mixCut, lump)}; }
    }
    // 운용 방식 변경안: 성장형으로 바꿨을 때
    const reqG = this.required(goal, months, lump, SCEN.growth);
    const rateOpt = {req: reqG, gap: reqG - capacity, closes: reqG - capacity <= 10000, scen: SCEN.growth};
    return {req, gap, period, amount, spend, mix, rateOpt};
  }
};

/* ---------- 표시 도우미 ---------- */
const fmtMan = x => (Math.round(x/10000)).toLocaleString('ko-KR') + '만 원';
const fmtMan1 = x => { const m=x/10000; return (m>=100? Math.round(m).toLocaleString('ko-KR') : (Math.round(m*10)/10).toLocaleString('ko-KR')) + '만 원'; };
const fmtWon = x => Math.round(x).toLocaleString('ko-KR') + '원';
const fmtGain = x => x < 10000 ? fmtWon(x) : fmtMan1(x);
const fmtIn = x => x ? Number(x).toLocaleString('ko-KR') : '';
const parseNum = s => Number(String(s).replace(/[^\d]/g,'')) || 0;
const pct = r => (r*100).toFixed(1).replace(/\.0$/,'') + '%';
const ym = (offset) => { const d=new Date(2026,8,1); d.setMonth(d.getMonth()+offset); return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}`; };
const ICON = {
  back:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
  check:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
};

/* ---------- 상태 ---------- */
const GOALS = [
  {id:'home', t:'내집마련', s:'전세·매매 보증금'},
  {id:'lump', t:'목돈 마련', s:'금액을 정해 모으기'},
  {id:'buy',  t:'구매 자금', s:'차·가전·여행'},
  {id:'debt', t:'부채 상환', s:'학자금·카드·대출'},
  {id:'fund', t:'비상금', s:'생활비 3~6개월분'}
];
const S = {
  screen:'start', hist:[],
  mode:null, goalId:null, goal:0, months:0,
  path:'quick', income:0, capacity:0, essential:0, discretionary:null, asset:0, debt:0, irregular:false, incomeMin:0, lump:0,
  scen:'safe', customRate:0.04, showRate:false,
  plan:null, chat:[], pick:null, rec:null, checkin:{saved:null}
};
function go(screen){ S.hist.push(S.screen); S.screen=screen; render(); window.scrollTo(0,0); }
function back(){ if(S.hist.length){ S.screen=S.hist.pop(); render(); window.scrollTo(0,0);} }
function reset(){ Object.assign(S,{screen:'start',hist:[],mode:null,goalId:null,goal:0,months:0,path:'quick',income:0,capacity:0,essential:0,discretionary:null,asset:0,debt:0,irregular:false,incomeMin:0,lump:0,scen:'safe',customRate:0.04,showRate:false,plan:null,chat:[],pick:null,rec:null,checkin:{saved:null}}); render(); window.scrollTo(0,0); }
function effIncome(){ return S.irregular ? S.incomeMin : S.income; }
function effCapacity(){ return S.path==='precise' ? effIncome() - S.essential - (S.discretionary||0) : S.capacity; }
function setScen(k){ S.scen=k; if(k==='custom') S.showRate=true; render(); }

/* ---------- 에이빠 말 (템플릿) ---------- */
const VOICE = {
  start: '어떤 상품이 좋은지보다 <b>무엇을 이루고 싶은지</b>부터 물어볼게요. 숫자는 제가 계산하고, 결정은 같이 해요.',

  resultGap: (o) => `${S.months}개월 안에 ${fmtMan(S.goal)}을 모으려면 매달 <b>약 ${fmtMan(o.req)}</b>이 필요해요. 지금은 ${fmtMan(effCapacity())}이라 <b>${fmtMan(o.gap)}이 부족</b>해요. 하나만 양보하면 길이 생겨요.`,

  rateInsight: (reqS, reqG, months) => {
    const diff = reqS - reqG; const ratio = diff/reqS;
    if(ratio < 0.08) return `수익률을 ${pct(SCEN.safe.rate)}에서 ${pct(SCEN.growth.rate)}로 올려도 필요액은 ${fmtMan(diff)}밖에 안 줄어요. ${months}개월짜리 목표에선 수익률보다 <b>저축액이 힘이 세요</b>. 원금 손실 위험까지 생각하면 안전형이 맞아요.`;

  },
  calendar: (p) => `이번 달 할 일은 하나예요. <b>${fmtMan(p.deposit)}</b>을 ${p.scen.kind==='simple'?'적금 통장':'적립 계좌'}으로 옮기기. 옮겼으면 아래에 적어주세요.`
};

/* ---------- 공통 부품 ---------- */
function topbar(step){
  const showBack = S.hist.length>0;
  return `<div class="top"><div class="row">
    <button class="back" aria-label="뒤로" ${showBack?'onclick="back()"':'style="visibility:hidden"'}>${ICON.back}</button>
    ${showBack?'<button class="home" onclick="reset()">처음으로</button>':''}
  </div>${step?`<div class="progress" role="progressbar" aria-valuenow="${step}" aria-valuemax="5"><i style="width:${step/5*100}%"></i></div>`:''}</div>`;
}
function voice(html){ return `<div class="voice"><div class="who">에이빠</div><div class="bubble">${html}</div></div>`; }
function cta(label, fn, opts={}){ return `<div class="inner"><button class="btn" ${opts.disabled?'disabled':''} onclick="${fn}">${label}</button>${opts.ghost?`<button class="btn ghost" onclick="${opts.ghost[1]}">${opts.ghost[0]}</button>`:''}</div>`; }
function amountField(key, unit, placeholder, opts={}){
  return `<div class="amount ${opts.sm?'sm':''} ${opts.xs?'xs':''}"><input inputmode="numeric" placeholder="${placeholder||'0'}" value="${opts.raw?(S[key]||''):fmtIn(S[key])}" oninput="${opts.raw?`S['${key}']=parseNum(this.value)`:`S['${key}']=parseNum(this.value);this.value=fmtIn(S['${key}'])`};${opts.on||''}"><span class="unit">${unit}</span></div>`;
}
function scenSeg(){
  return `<div class="seg">${['safe','balanced','growth'].map(k=>`<button class="${S.scen===k?'on':''}" onclick="setScen('${k}')">${SCEN[k].label}<small>연 ${pct(SCEN[k].rate)}</small></button>`).join('')}<button class="${S.scen==='custom'?'on':''}" onclick="setScen('custom')">직접<small>${S.scen==='custom'?pct(S.customRate):'입력'}</small></button></div>
  ${S.scen==='custom'||S.showRate? `<div class="field"><div class="amount xs"><input inputmode="decimal" placeholder="4.0" value="${(S.customRate*100)}" oninput="const v=parseFloat(this.value); if(!isNaN(v)&&v>=0&&v<=30){S.customRate=v/100; S.scen='custom'; document.getElementById('cr').textContent='연 '+v+'% 가정으로 계산';}"><span class="unit">% (연)</span></div><p class="hint" id="cr">연 ${(S.customRate*100)}% 가정으로 계산. 세금 15.4% 동일 적용</p>${S.scen!=='custom'?'':'<button class="link" onclick="S.showRate=false;render()">닫기</button>'}</div>`:''}`;
}
function chart(goal, dep, months, lump){
  const sc = ENGINE.sc();
  const reach = ENGINE.months(goal,dep,lump,sc);
  const N = Math.max(months, Math.min(isFinite(reach)?reach:months, months+24));
  const W=340,H=150,px=6,py=14; const maxY=Math.max(goal, ENGINE.total(dep,N,lump,sc))*1.08;
  const x=n=>px+(W-2*px)*n/N, y=v=>H-py-(H-2*py)*v/maxY;
  let d='', p='';
  for(let n=0;n<=N;n++){ const X=x(n).toFixed(1); d+=(n?'L':'M')+X+' '+y(ENGINE.total(dep,n,lump,sc)).toFixed(1)+' '; p+=(n?'L':'M')+X+' '+y(dep*n+lump).toFixed(1)+' '; }
  const area = d + `L ${x(N).toFixed(1)} ${H-py} L ${px} ${H-py} Z`;
  const gx = isFinite(reach)&&reach<=N ? x(reach) : null;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="누적 저축 그래프">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4338CA" stop-opacity=".2"/><stop offset="1" stop-color="#4338CA" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#g)"/>
    <line x1="${px}" x2="${W-px}" y1="${y(goal)}" y2="${y(goal)}" stroke="#B0B8C1" stroke-width="1.5" stroke-dasharray="3 4"/>
    <path d="${p}" fill="none" stroke="#B0B8C1" stroke-width="1.5" stroke-dasharray="2 4"/>
    <path d="${d}" fill="none" stroke="#4338CA" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${gx!=null?`<circle cx="${gx}" cy="${y(goal)}" r="5.5" fill="#C6F432" stroke="#4338CA" stroke-width="2.5"/>`:''}
    <text x="${W-px}" y="${y(goal)-6}" text-anchor="end" font-size="11" fill="#8B95A1">목표 ${fmtMan(goal)}</text>
  </svg>
  <div class="legend"><span><i></i>총액 (이자·수익 포함)</span><span><i class="p"></i>원금만</span></div>`;
}
function basis(){
  const sc=ENGINE.sc();
  return `<details class="basis"><summary>계산 근거와 가정</summary>
    <p><b>지금 적용 중</b>: ${sc.label} 연 ${pct(sc.rate)}, ${sc.kind==='simple'?'단리(적금 방식, 매달 넣은 돈마다 만기까지 이자)':'월복리(적립식, 수익이 다시 투자됨)'}, 이자·수익에 세금 15.4%.</p>
    <p>안전형: ${SCEN.safe.src}</p>
    <p>성장형: ${SCEN.growth.src}</p>
    <p>이미 모아둔 돈은 같은 방식으로 굴린다고 가정. 적금 만기액 = <code>월납 × n + 월납 × (연이율/12) × n(n+1)/2 × (1 − 세율)</code>, 적립식 = <code>월납 × ((1+i)ⁿ − 1)/i</code> (i = 연이율/12), 수익분에만 세금.</p>
    <p>지출 절감안이 "현실적"인 기준: 절감액이 재량지출의 40% 이하. 혼합안은 재량지출의 40%를 5만 원 단위로 내림해 줄이고 기간을 다시 계산.</p>
    <p>본 구현에서는 금융감독원 금융상품통합비교공시의 실제 공시 금리로 안전형 금리를 채웁니다. 투자 수익률은 과거 평균이며 미래를 보장하지 않습니다.</p>
  </details>`;
}

  negotiate(){
    const cap = effCapacity(); const sc = ENGINE.sc();
    const o = ENGINE.options({goal:S.goal, months:S.months, capacity:cap, discretionary:S.discretionary, lump:S.lump});
    const needDisc = S.discretionary==null;
    const opt=(id,t,d,v,vs,tags,disabled)=>`<button class="opt ${S.pick===id?'on':''}" ${disabled?'disabled':''} onclick="S.pick='${id}';render()"><span><span class="t">${t}</span><span class="d">${d}</span>${tags?`<span class="tags">${tags}</span>`:''}</span><span class="v num">${v}<small>${vs||''}</small></span></button>`;
    const chat = S.chat.map(c=> c.who==='me' ? `<div class="me"><span>${c.text}</span></div>` : voice(c.text)).join('');
    const rateCard = sc.key!=='growth' ? opt('rate', `성장형으로 바꾸기`, o.rateOpt.closes ? `연 ${pct(SCEN.growth.rate)} 가정이면 지금 금액으로 충분해요` : `연 ${pct(SCEN.growth.rate)} 가정. 부족 ${fmtMan(o.gap)} 중 ${fmtMan(o.gap-o.rateOpt.gap)}만 줄어요`, `${fmtMan(o.rateOpt.req)}`, '필요 월 저축액', o.rateOpt.closes?'<span class="pill accent">가능</span>':'<span class="pill warn">부족분 못 메움</span>', !o.rateOpt.closes) : '';
    return {top: topbar(4), main: `
      <h1>어떤 걸 양보할 수 있어요?</h1>
      <p class="sub">하나만 골라도 돼요. 못 미루는 게 있으면 그것부터 말해주세요.</p>
      <div class="quick">
        <button onclick="say('기간을 늘릴 수 있어요','period')">기간을 늘릴 수 있어요</button>
        <button onclick="say('목표금액을 낮춰도 돼요','amount')">목표금액을 낮춰도 돼요</button>
        <button onclick="say('지출을 줄여볼게요','spend')">지출을 줄여볼게요</button>
        <button onclick="say('이사 시기는 못 미뤄요','fixed')">이사 시기는 못 미뤄요</button>
        <button onclick="say('수익률을 높이면 안 돼요?','rate')">수익률을 높이면 안 돼요?</button>
      </div>
      ${chat}
      ${needDisc? `<div class="card"><div class="k">지출 조정안을 보려면 하나만 더</div>
        <p class="label" style="margin:10px 0 8px">재량지출 (식비·배달·쇼핑·구독·여가)</p>
        <div class="amount sm"><input inputmode="numeric" placeholder="0" oninput="S._d=parseNum(this.value);this.value=fmtIn(S._d)"><span class="unit">원</span></div>
        <div style="margin-top:12px"><button class="btn sm" onclick="S.discretionary=S._d||0;render()">계산하기</button></div></div>` : ''}
      <p class="label">조정안 · ${sc.label} 연 ${pct(sc.rate)} 기준</p>
      ${(()=>{ const list=[
        ['period', opt('period','기간 늘리기',`매달 ${fmtMan(cap)} 그대로`, isFinite(o.period)? `${o.period}개월`:'50년+', isFinite(o.period)? `${ym(o.period-1)} 도달`:'', S.rec==='period'?'<span class="pill lime">에이빠 추천</span>':'')],
        ['amount', opt('amount','목표금액 낮추기',`${S.months}개월 그대로`, `약 ${fmtMan(o.amount)}`, `${fmtMan(cap)}씩 ${S.months}개월`, S.rec==='amount'?'<span class="pill lime">에이빠 추천</span>':'')],
        ['spend', o.spend ? opt('spend','지출 줄이기',`재량지출 ${fmtMan(S.discretionary)}의 ${Math.round(o.spend.cut/S.discretionary*100)}%`, `−${fmtMan(o.spend.cut)}`, '매달 절감', `<span class="pill ${o.spend.feasible?'good':'warn'}">${o.spend.feasible?'현실적':'현실성 낮음'}</span>`, !o.spend.feasible)
                          : opt('spend','지출 줄이기','재량지출 입력 필요','—','', '', true)],
        ['mix', o.mix ? opt('mix','조금씩 나눠 양보',`매달 ${fmtMan(cap+o.mix.cut)}씩 · ${ym(o.mix.months-1)} 도달`, `${o.mix.months}개월`, `−${fmtMan(o.mix.cut)} 절감`, S.rec==='mix'?'<span class="pill lime">에이빠 추천</span>':'') : ''],
        ['rate', rateCard]
      ]; list.sort((a,b)=> (b[0]===S.rec) - (a[0]===S.rec)); return list.map(x=>x[1]).join(''); })()}
      <p class="note">숫자는 계산 엔진이 만들고, 에이빠는 어떤 숫자를 고를지 함께 정해요. 이 베타의 응답은 정해진 문장이고 본 구현에서는 Claude API가 생성해요.</p>`,
      cta: cta('이 안으로 확정', "pickConfirm()", {disabled:!S.pick})};
  },
  calendar(){
    const p = S.plan; const c = S.checkin; const sc = p.scen;
    const rows=[]; for(let n=1;n<=Math.min(p.months,12);n++){ const b=ENGINE.breakdown(p.deposit,n,p.lump,sc); rows.push({n, m:ym(n-1), tot:b.total, gains:b.gains}); }
    const fin = ENGINE.breakdown(p.deposit,p.months,p.lump,sc);
    const dev = c.saved!=null ? c.saved - p.deposit : null;
    let st='', msg='';
    if(dev!=null){
      const r = dev/p.deposit;
      if(r>=-0.05){ st='<span class="pill good">계획대로</span>'; msg=`좋아요. 이번 달은 계획대로예요.${dev>10000?` ${fmtMan(dev)} 더 모았으니 다음 달이 조금 가벼워져요.`:''}`; }
      else if(r>=-0.2){ st='<span class="pill warn">조금 부족</span>'; msg=`이번 달은 계획보다 ${fmtMan(-dev)} 덜 모았어요. 한 달 편차는 괜찮아요. 두 달 이어지면 다시 계산해요.`; }
      else { st='<span class="pill bad">재설계 권장</span>'; msg=`편차가 커요(${fmtMan(-dev)}). 이대로면 도달이 ${ENGINE.months(p.goal, Math.max(1,c.saved), p.lump, sc)-p.months}개월 늦어져요. 지금 다시 잡는 게 나아요.`; }
    }
    return {top: topbar(5), main: `
      <h1>이번 달 할 일</h1>
      <p class="sub">${p.label} · ${fmtMan(p.goal)} · ${sc.label} 연 ${pct(sc.rate)} · ${p.months>0?ym(p.months-1)+' 도달':'이미 도달'}</p>
      <div class="card">
        <div class="k">${sc.kind==='simple'?'적금 통장으로 옮기기':'적립 계좌로 옮기기'}</div>
        <div class="big num">${fmtMan(p.deposit)}</div>
        <div class="stats">
          <div class="stat"><div class="k">매달</div><div class="v num">${p.months}개월</div></div>
          <div class="stat"><div class="k">도달 예정</div><div class="v num">${p.months>0?ym(p.months-1):'지금'}</div></div>
        </div>
        <div class="row" style="margin-top:8px"><span class="l">원금</span><span class="r num">${fmtMan(fin.principal)}</span></div>
        <div class="row"><span class="l">이자·수익 (세후)</span><span class="r num" style="color:var(--good)">+${fmtGain(fin.gains)}</span></div>
        <div class="row"><span class="l">도달 시점 합계</span><span class="r num">${fmtMan(fin.total)}</span></div>
      </div>
      ${voice(VOICE.calendar(p))}
      <div class="card">
        <div class="k">이번 달 점검 · ${ym(0)}</div>
        <p class="label" style="margin:10px 0 8px">실제로 옮긴 금액</p>
        <div class="amount sm"><input inputmode="numeric" placeholder="0" value="${fmtIn(c.saved)}" oninput="S.checkin.saved=parseNum(this.value);this.value=fmtIn(S.checkin.saved)"><span class="unit">원</span></div>
        <div style="margin-top:12px;display:flex;gap:8px;align-items:center"><button class="btn sm" onclick="render()">계획과 비교</button>${st}</div>
        ${dev!=null? `<div style="margin-top:14px">${voice(msg)}</div>${dev/p.deposit < -0.2 ? `<button class="btn soft" style="height:48px;font-size:15px" onclick="S.capacity=S.checkin.saved;S.path='quick';S.pick=null;S.rec=null;S.chat=[];go('negotiate')">지금 금액으로 다시 설계</button>`:''}` : ''}
      </div>
      <div class="card">
        <div class="k">월별 계획 · 첫 12개월</div>
        <div class="mhead" style="margin-top:8px"><span>월</span><span>납입</span><span>총액 (이자·수익 포함)</span></div>
        ${rows.map(r=>`<div class="month ${r.n===p.months?'goal':''}"><span class="m num">${r.m}</span><span class="num">${fmtMan(p.deposit)}</span><span class="tot num">${r.n===p.months?'목표 도달 · ':''}${fmtMan1(r.tot)}<small>+${fmtGain(r.gains)} 이자·수익</small></span></div>`).join('')}
        ${p.months>12?`<p class="hint">이후 ${p.months-12}개월은 같은 금액으로 이어져요. ${ym(p.months-1)}에 ${fmtMan(fin.total)}이 돼요.</p>`:''}
      </div>
      <p class="note">확장 단계에서는 적금 만기, 정책금융 신청 기간, 편차가 커질 때 에이빠가 먼저 알려줘요.</p>`,
      cta: cta('처음으로', "reset()")};
  }
};

/* ---------- 동작 ---------- */
function fillSample(){
  if(S.mode==='open'){ S.irregular=false; S.income=2500000; S.capacity=500000; S.path='quick'; S.lump=0; }
  else { S.goalId=S.goalId||'home'; S.goal=S.goal||30000000; S.months=S.months||24; S.irregular=false; S.income=2500000; S.path='quick'; S.capacity=800000; S.lump=0; }
  render();
}
function startNeg(){ S.pick=null; S.rec=null; S.chat=[]; go('negotiate'); }
function say(text, intent){
  const cap=effCapacity(); const o=ENGINE.options({goal:S.goal, months:S.months, capacity:cap, discretionary:S.discretionary, lump:S.lump});
  S.chat.push({who:'me', text});
  let reply='';
  if(intent==='period'){ S.pick='period'; reply=isFinite(o.period)? `그럼 금액은 그대로 두고 기간만 <b>${o.period}개월</b>로 잡을게요. ${ym(o.period-1)}에 닿아요. 매달 ${fmtMan(cap)}은 지금도 하고 있는 금액이라 부담이 안 늘어요.` : '지금 금액으로는 기간을 늘려도 50년이 넘어요. 목표금액이나 지출 쪽을 같이 봐야 해요.'; }
  else if(intent==='amount'){ S.pick='amount'; reply=`${S.months}개월 안에 ${fmtMan(cap)}씩이면 <b>약 ${fmtMan(o.amount)}</b>까지 모여요. 목표를 여기에 맞추고, 나머지는 다음 목표로 넘기는 것도 방법이에요.`; }
  else if(intent==='spend'){
    if(!o.spend){ reply='재량지출을 알려주면 얼마를 줄여야 하는지 계산할게요. 아래 칸에 적어주세요.'; }
    else if(o.spend.feasible){ S.pick='spend'; reply=`매달 <b>${fmtMan(o.spend.cut)}</b>만 줄이면 원래 계획대로 가요. 재량지출의 ${Math.round(o.spend.cut/S.discretionary*100)}%라 해볼 만해요.`; }
    else { S.rec = o.mix?'mix':'period'; S.pick=S.rec; reply=`지출만으로 ${fmtMan(o.spend.cut)}을 줄이는 건 재량지출의 ${Math.round(o.spend.cut/S.discretionary*100)}%라 현실적이지 않아요. ${o.mix?`대신 매달 <b>${fmtMan(o.mix.cut)}</b>만 줄이고 기간을 <b>${o.mix.months}개월</b>로 잡는 안은 어때요?`:'기간을 같이 늘리는 쪽을 권해요.'}`; }
  }
  else if(intent==='fixed'){
    if(!o.spend){ reply='알겠어요. 기간은 그대로 둘게요. 그럼 목표금액이나 지출 중 하나를 봐야 하는데, 재량지출을 알려주면 지출 쪽을 계산해볼게요.'; }
    else if(o.mix && o.mix.months<=S.months+6){ S.rec='mix'; S.pick='mix'; reply=`그럼 기간은 최대한 지키는 쪽으로 볼게요. 매달 <b>${fmtMan(o.mix.cut)}</b>만 줄이고 <b>${o.mix.months}개월</b>로 잡는 혼합안이 현실적이에요. ${S.months}개월과 ${o.mix.months-S.months}개월 차이예요.`; }
    else { S.rec='amount'; S.pick='amount'; reply=`기간을 못 미루면 목표금액을 <b>약 ${fmtMan(o.amount)}</b>으로 잡는 게 현실적이에요. 부족한 부분은 이사 뒤 두 번째 목표로 넘길 수 있어요.`; }
  }
  else if(intent==='rate'){
    const r=o.rateOpt;
    if(r.closes){ S.rec='rate'; S.pick='rate'; reply=`성장형(연 ${pct(SCEN.growth.rate)} 가정)이면 지금 금액으로도 닿아요. 다만 ${S.months<36?'기간이 3년 미만이라 결과가 시장에 크게 흔들려요. ':''}원금 손실 가능성을 감수할 수 있을 때만 고르세요.`; }
    else { reply=`수익률을 연 ${pct(SCEN.growth.rate)}로 올려도 필요액은 ${fmtMan(o.req)}에서 <b>${fmtMan(r.req)}</b>으로 ${fmtMan(o.req-r.req)} 줄 뿐이에요. 부족한 ${fmtMan(o.gap)}은 못 메워요. ${S.months}개월짜리 목표에선 수익률보다 저축액이 힘이 세요. 기간·금액·지출 중에서 고르는 게 맞아요.`; }
  }
  S.chat.push({who:'ai', text:reply});
  render();
}
function pickConfirm(){
  const cap=effCapacity(); const o=ENGINE.options({goal:S.goal, months:S.months, capacity:cap, discretionary:S.discretionary, lump:S.lump});
  if(S.pick==='period') confirmPlan(cap, o.period, '기간 연장');
  else if(S.pick==='amount'){ S.goal=Math.round(o.amount); confirmPlan(cap, S.months, '목표금액 조정'); }
  else if(S.pick==='spend'){ confirmPlan(cap+o.spend.cut, S.months, '지출 절감'); }
  else if(S.pick==='mix'){ confirmPlan(cap+o.mix.cut, o.mix.months, '혼합안'); }
  else if(S.pick==='rate'){ S.scen='growth'; confirmPlan(cap, S.months, '성장형 전환'); }
}
function confirmPlan(deposit, months, label){
  S.plan={deposit, months, goal:S.goal, label, lump:S.lump, scen:Object.assign({}, ENGINE.sc())}; S.months=months; S.checkin={saved:null}; go('calendar');
}

/* ---------- 렌더 ---------- */
let lastScreen=null;
function render(){
  const s = SCREENS[S.screen]();
  const cls = S.screen!==lastScreen ? ' class="enter"' : ''; lastScreen=S.screen;
  document.getElementById('app').innerHTML = s.top + '<main'+cls+'>' + s.main + '</main>';
  document.getElementById('cta').innerHTML = s.cta;
}
render();
</script>
</body>
</html>
